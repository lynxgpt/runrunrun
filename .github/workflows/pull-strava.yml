name: Pull Strava Activities

# Pulls newest Strava run daily at 6am Eastern (10:00 UTC).
# Commits directly to master, which triggers the deploy workflow.
#
# REQUIRED repository secrets:
#   STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET
#   STRAVA_ACCESS_TOKEN, STRAVA_REFRESH_TOKEN
#   STRAVA_ROTATE_PAT  — PAT with repo+workflow scope for token rotation

on:
  schedule:
    - cron: "0 10 * * *" # 6am Eastern (EDT = UTC-4)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      HAS_ROTATE_PAT: ${{ secrets.STRAVA_ROTATE_PAT != '' }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write .env.local from secrets
        run: |
          cat > .env.local <<EOF
          STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_ACCESS_TOKEN=${{ secrets.STRAVA_ACCESS_TOKEN }}
          STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}
          EOF

      - name: Pull Strava activities
        run: node scripts/pull-strava.mjs

      - name: Rotate Strava tokens (if PAT configured)
        if: ${{ env.HAS_ROTATE_PAT == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.STRAVA_ROTATE_PAT }}
        run: |
          ACCESS=$(grep '^STRAVA_ACCESS_TOKEN=' .env.local | cut -d= -f2-)
          REFRESH=$(grep '^STRAVA_REFRESH_TOKEN=' .env.local | cut -d= -f2-)
          gh secret set STRAVA_ACCESS_TOKEN --body "$ACCESS" --repo "$GITHUB_REPOSITORY"
          gh secret set STRAVA_REFRESH_TOKEN --body "$REFRESH" --repo "$GITHUB_REPOSITORY"

      - name: Remove .env.local before committing
        run: rm -f .env.local

      - name: Commit and push to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gpx public/tracks public/photos public/strava-meta.json src/lib/gpx-processed.ts
          if git diff --staged --quiet; then
            echo "No new activities."
          else
            git commit -m "data: new Strava activity ($(date -u +%Y-%m-%d))"
            git push origin master
          fi
